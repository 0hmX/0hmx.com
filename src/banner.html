<div id="suspension-fleet">
  <div class="viz-controls">
    <label class="form-label">Camera<select class="form-select" id="fleet-camera"><option value="all">All three</option><option value="car">Car close-up</option><option value="bus">Bus close-up</option><option value="truck">Truck close-up</option></select></label>
    <label class="form-label">Speed for all (km/h)<input class="form-control" id="fleet-speed" type="number" inputmode="numeric" min="0" max="90" step="1" value="15"></label>
    <button class="btn" id="fleet-run" type="button">Pause</button>
  </div>
  <div id="fleet-lanes"></div>
  <template id="fleet-lane-template">
    <section class="vehicle-lane">
      <div class="viz-row"><span data-vehicle-name></span><span id="failure-status" class="text-destructive text-small" role="status" aria-live="polite"></span></div>
      <canvas id="road-scene" role="img" aria-label="Vehicle suspension moving over a rough road."></canvas>
      <span id="play-status" class="sr-only" aria-live="polite"></span>
      <div hidden>
        <select id="vehicle"><option value="car">Hatchback</option><option value="bus">Indian passenger bus</option><option value="truck">Indian cargo truck</option></select>
        <input id="cutaway" type="checkbox" checked>
        <span id="vehicle-spec"></span><span id="telemetry"></span>
        <span id="rear-health"></span><span id="rear-load"></span><div id="rear-meter"><div id="rear-bar"></div></div>
        <span id="front-health"></span><span id="front-load"></span><div id="front-meter"><div id="front-bar"></div></div>
        <input id="strength" type="range" min="5.4" max="39.2" step="0.1" value="14.7"><output id="strength-value"></output>
        <select id="mode"><option value="passive">Passive</option></select>
        <select id="surface"><option value="mixed">Mixed road</option><option value="potholes">Potholes</option><option value="washboard">Washboard</option></select>
        <input id="rough" type="range" min="0" max="100" value="100"><output id="rough-value"></output>
        <input id="spring" type="range" min="14" max="65" value="20"><output id="spring-value"></output>
        <input id="damper" type="range" min="0.2" max="6" step="0.1" value="1.5"><output id="damper-value"></output>
        <output id="speed-value"></output>
      </div>
    </section>
  </template>
</div>
<style>
#suspension-fleet{width:100%} #suspension-fleet #fleet-lanes{display:grid;grid-template-columns:5.3fr 12.42fr 9.8fr;gap:0} #suspension-fleet .vehicle-lane{min-width:0} #suspension-fleet.is-focused #fleet-lanes{grid-template-columns:minmax(0,1fr)} #suspension-fleet.is-focused canvas{height:300px} #suspension-fleet canvas{display:block;width:100%;height:180px} #suspension-fleet .vehicle-lane{margin-top:12px} #suspension-fleet .vehicle-lane .viz-row{justify-content:space-between} @media(max-width:450px){#suspension-fleet canvas{height:110px}}
</style>
